<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173e33"><meta name="description" content="自定义生活目标，记录每次行动。"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>有进度 · 生活目标</title>
<style>
:root{color-scheme:light;--paper:#f2f6f1;--ink:#173e33;--sub:#53685d;--mint:#d9efce;--line:#d8e2d9;--white:#fff;--accent:#285d48}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 16px;min-height:44px;font-weight:650;background:var(--ink);color:white}button.soft{background:#e8f0e8;color:var(--ink)}button.light{background:var(--mint);color:var(--ink)}button.link{background:none;color:var(--ink);padding:8px}button.danger{background:#f9e9e5;color:#832f25}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid #428760;outline-offset:2px}
main{max-width:690px;margin:auto;padding:24px 18px 50px}.mast,.between,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.mast{margin-bottom:16px}.brand{font-weight:800;letter-spacing:.12em}.brand b{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:11px;background:var(--ink);color:#fff;margin-right:8px}.hero{padding:25px;border-radius:24px;background:var(--ink);color:white}.hero p{margin:0;color:#c9e0d1}.hero h1{font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.12;margin:9px 0 12px}.hero .actions{margin-top:22px;flex-wrap:wrap;justify-content:flex-start}.hero .quiet{font-size:.93rem}.nav{display:flex;gap:6px;margin:20px 0 14px;border-bottom:1px solid var(--line)}.nav button{background:none;color:var(--sub);border-radius:0;border-bottom:3px solid transparent}.nav button[aria-selected=true]{border-color:var(--accent);color:var(--ink)}h2{font-size:1.18rem;margin:0 0 12px}h3{margin:5px 0 8px;font-size:1.25rem;overflow-wrap:anywhere}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;margin:0 0 11px}.card.empty{padding:24px}.meta,.muted{color:var(--sub);font-size:.92rem}.tag{display:inline-block;background:#e8f1e6;border-radius:999px;padding:3px 9px;font-size:.87rem}.track{height:9px;background:#e7efe8;border-radius:20px;margin:10px 0 6px;overflow:hidden}.fill{height:100%;background:#3f805f;border-radius:20px}.card .actions{justify-content:flex-start;flex-wrap:wrap;margin-top:13px}footer{font-size:.88rem;color:var(--sub);margin-top:24px}.banner{padding:9px 12px;background:#e6f0db;border-radius:10px;margin:15px 0;overflow-wrap:anywhere}.error{color:#8c251d;min-height:1.5em;margin:4px 0}dialog{border:1px solid var(--line);border-radius:20px;padding:19px;width:min(calc(100% - 24px),460px);max-height:86dvh;color:var(--ink);background:white}dialog::backdrop{background:#0d281eb0}.form{display:grid;gap:11px}.form label{display:grid;gap:4px;font-size:.93rem;font-weight:650}.form input,.form select,.form textarea{width:100%;min-width:0;border:1px solid #9eb5a6;border-radius:10px;min-height:44px;padding:8px 10px;background:white;color:var(--ink)}.form .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form textarea{min-height:75px}.wrap{overflow-wrap:anywhere}.log{display:flex;gap:10px;align-items:center;justify-content:space-between}.log p{margin:3px 0;white-space:pre-wrap}.log .actions{margin:0;justify-content:flex-end}.toast{min-height:24px;color:var(--accent);margin:3px 0}
[hidden]{display:none!important}@media(max-width:350px){main{padding-inline:12px}.hero{padding:18px}.nav button{padding-inline:10px}}
</style>
<main>
<header class="mast"><div class="brand"><b aria-hidden="true">✓</b>有进度</div><button id="settings" class="soft">备份与设置</button></header>
<section class="hero"><p id="today"></p><h1>把目标，变成进度。</h1><p id="summary" class="quiet"></p><div class="actions"><button id="new" class="light">＋ 新建目标</button></div></section>
<div class="toast" id="toast" aria-live="polite"></div>
<div id="update" class="banner" hidden>新版已就绪。<button id="refresh" class="soft">更新应用</button></div>
<nav class="nav" role="tablist" aria-label="查看"><button role="tab" data-view="active" aria-controls="panel" aria-selected="true">进行中</button><button role="tab" data-view="history" aria-controls="panel" aria-selected="false">打卡记录</button><button role="tab" data-view="archived" aria-controls="panel" aria-selected="false">已归档</button></nav>
<section id="panel" role="tabpanel" tabindex="0"></section>
<footer>记录只保存在当前设备的浏览器里。换设备或清理浏览器前，请先导出备份。</footer>
</main><dialog id="modal" aria-labelledby="dialog-title"><div class="between"><h2 id="dialog-title"></h2><button class="link" id="close" aria-label="关闭">关闭</button></div><div id="modal-body"></div><p class="error" id="modal-error" role="alert"></p></dialog>
<script src="./app.js" defer></script></html>
